<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Literata:opsz,wght@7..72,500;7..72,600&display=swap" rel="stylesheet">
<title>Pricegent Concept Atlas</title>
<style>
*{box-sizing:border-box}body{margin:0;width:390px;height:844px;overflow:hidden;background:#173b50;color:#f2e8d4;font:15px "DM Sans",sans-serif}main{padding:26px 22px}.bar{height:40px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:18px;font-weight:700;letter-spacing:-.4px}.avatar{width:34px;height:34px;border-radius:50%;background:#2b817b;display:grid;place-items:center;font-size:12px}.headline{font:600 29px/1.12 "Literata",serif;margin:29px 0 9px}.intro{margin:0;color:#c4d6cf;line-height:1.5}.start{margin-top:22px;border:1px solid #416977;border-radius:9px;padding:16px;background:#1d4659}.start label{display:block;text-transform:uppercase;letter-spacing:1px;color:#c5d6c6;font-size:10px;font-weight:700;margin-bottom:11px}.input{height:45px;border:1px solid #769293;border-radius:5px;padding:13px;color:#d4dfd6;font-size:13px}.button{margin-top:11px;height:43px;border-radius:5px;background:#d8a446;color:#173b50;display:grid;place-items:center;font-weight:700}.section{display:flex;justify-content:space-between;align-items:center;margin:26px 0 4px}.section h2{font-size:15px;margin:0}.section span{font-size:11px;color:#c5d6c6}.map{position:relative;height:255px;margin:12px -3px 0;border-top:1px solid #416977;border-bottom:1px solid #416977;background:repeating-linear-gradient(15deg,transparent 0 27px,rgba(131,177,154,.12) 28px 29px,transparent 30px 51px)}.route{position:absolute;height:2px;background:#d8a446;transform-origin:left center}.r1{left:58px;top:83px;width:117px;transform:rotate(21deg)}.r2{left:163px;top:126px;width:109px;transform:rotate(-30deg);background:#69b3a0}.r3{left:92px;top:167px;width:125px;transform:rotate(-19deg);background:#d8a446}.node{position:absolute;border-radius:50%;background:#f2e8d4;color:#173b50;width:15px;height:15px;border:3px solid #2b817b}.node b{position:absolute;left:19px;top:-5px;white-space:nowrap;font-size:11px;font-weight:600;color:#f2e8d4}.n1{left:47px;top:75px}.n2{left:156px;top:118px;width:18px;height:18px;border-color:#d8a446}.n3{right:57px;top:66px}.n4{left:82px;top:160px}.n5{right:82px;top:154px}.bottom{display:flex;justify-content:space-around;padding-top:20px;color:#c4d6cf;font-size:11px}.bottom b{color:#f2e8d4}
</style>
</head>
<body>
<main>
<div class="bar"><span class="brand">pricegent</span><span class="avatar">AM</span></div>
<h1 class="headline">See how the ideas<br>fit together.</h1>
<p class="intro">Your studies become a map you can explore, question, and remember.</p>
<section class="start"><label>New study</label><div class="input">Paste notes or add a document</div><div class="button">Build a concept map</div></section>
<div class="section"><h2>Cell structure</h2><span>12 connected ideas</span></div>
<div class="map"><i class="route r1"></i><i class="route r2"></i><i class="route r3"></i><i class="node n1"><b>Cell</b></i><i class="node n2"><b>Energy</b></i><i class="node n3"><b>Membrane</b></i><i class="node n4"><b>Proteins</b></i><i class="node n5"><b>Transport</b></i></div>
<nav class="bottom"><b>Atlas</b><span>Studies</span><span>Library</span></nav>
</main>
</body>
</html>
